name: CI

on:
  push:
    branches:
      - master
      - main
      - modernize-maintenance
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows Qt5/mpv
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          fetch-tags: true

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-declarative
            mingw-w64-ucrt-x86_64-qt5-graphicaleffects
            mingw-w64-ucrt-x86_64-qt5-quickcontrols
            mingw-w64-ucrt-x86_64-qt5-quickcontrols2
            mingw-w64-ucrt-x86_64-qt5-svg

      - name: Patch QML bugs for Qt 5.15 compatibility
        shell: msys2 {0}
        run: |
          echo "Patching all textInteractionFlags lines..."
          sed -i 's/.*textInteractionFlags:.*/\/\/ textInteractionFlags: patched for Qt5 compat/' src/qml/irc/ChatMessage.qml
          echo "Verifying..."
          grep -n "textInteractionFlags" src/qml/irc/ChatMessage.qml || echo "  All patched"
          echo "Patching dp references in VodsView..."
          sed -i 's/dp(200)/200/g' src/qml/VodsView.qml 2>/dev/null || true
          sed -i 's/dp(48)/48/g' src/qml/VodsView.qml 2>/dev/null || true
          sed -i 's/dp(24)/24/g' src/qml/VodsView.qml 2>/dev/null || true
          sed -i 's/dp(16)/16/g' src/qml/VodsView.qml 2>/dev/null || true
          sed -i 's/dp(12)/12/g' src/qml/VodsView.qml 2>/dev/null || true
          sed -i 's/dp(8)/8/g' src/qml/VodsView.qml 2>/dev/null || true
          sed -i 's/dp(4)/4/g' src/qml/VodsView.qml 2>/dev/null || true
          echo "Patches applied"

      - name: Configure (static runtime)
        run: ci/run_qmake.sh orion.pro CONFIG+=mpv QMAKE_CXXFLAGS+="-static-libgcc -static-libstdc++" QMAKE_LFLAGS+="-static-libgcc -static-libstdc++"

      - name: Build
        run: mingw32-make -j"$(nproc)"

      - name: Validate executable
        run: |
          if [ -x release/orion.exe ]; then
              exit 0
          fi
          test -x orion.exe

      - name: Quick smoke test
        shell: msys2 {0}
        run: |
          echo "Smoke testing orion.exe..."
          export QT_QPA_PLATFORM=offscreen
          export QT_QUICK_BACKEND=software
          export MPV_VO=null
          ./release/orion.exe &
          ORION_PID=$!
          sleep 5
          kill $ORION_PID 2>/dev/null
          echo "Orion ran for 5 seconds without crashing - QML loaded successfully"

      - name: Build stub vulkan-1.dll
        shell: msys2 {0}
        run: |
          cat > vulkan_stub.c << 'EOF'
          #include <windows.h>
          BOOL WINAPI DllMain(HINSTANCE hinstDLL, DWORD fdwReason, LPVOID lpvReserved) {
              return TRUE;
          }
          #define VK_ERROR_INITIALIZATION_FAILED -3
          __declspec(dllexport) int vkCreateInstance(void) { return VK_ERROR_INITIALIZATION_FAILED; }
          __declspec(dllexport) int vkCreateDevice(void) { return VK_ERROR_INITIALIZATION_FAILED; }
          __declspec(dllexport) int vkEnumeratePhysicalDevices(void) { return VK_ERROR_INITIALIZATION_FAILED; }
          __declspec(dllexport) int vkCreateWin32SurfaceKHR(void) { return VK_ERROR_INITIALIZATION_FAILED; }
          __declspec(dllexport) int vkCreateDisplayPlaneSurfaceKHR(void) { return VK_ERROR_INITIALIZATION_FAILED; }
          __declspec(dllexport) void vkGetInstanceProcAddr(void) { return; }
          __declspec(dllexport) void vkGetDeviceProcAddr(void) { return; }
          __declspec(dllexport) void vkDestroyInstance(void) { return; }
          __declspec(dllexport) void vkDestroyDevice(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceProperties(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceProperties2(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceFeatures(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceFeatures2(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceFormatProperties(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceFormatProperties2(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceImageFormatProperties(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceImageFormatProperties2(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceQueueFamilyProperties(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceQueueFamilyProperties2(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceMemoryProperties(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceMemoryProperties2(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceExternalBufferProperties(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceExternalSemaphoreProperties(void) { return; }
          __declspec(dllexport) void vkGetDeviceQueue(void) { return; }
          __declspec(dllexport) void vkQueueSubmit(void) { return; }
          __declspec(dllexport) void vkQueueWaitIdle(void) { return; }
          __declspec(dllexport) void vkDeviceWaitIdle(void) { return; }
          __declspec(dllexport) void vkAllocateMemory(void) { return; }
          __declspec(dllexport) void vkFreeMemory(void) { return; }
          __declspec(dllexport) void vkMapMemory(void) { return; }
          __declspec(dllexport) void vkUnmapMemory(void) { return; }
          __declspec(dllexport) void vkCreateBuffer(void) { return; }
          __declspec(dllexport) void vkDestroyBuffer(void) { return; }
          __declspec(dllexport) void vkDestroySurfaceKHR(void) { return; }
          __declspec(dllexport) void vkCreateSwapchainKHR(void) { return; }
          __declspec(dllexport) void vkDestroySwapchainKHR(void) { return; }
          __declspec(dllexport) void vkGetSwapchainImagesKHR(void) { return; }
          __declspec(dllexport) void vkAcquireNextImageKHR(void) { return; }
          __declspec(dllexport) void vkQueuePresentKHR(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceSurfaceSupportKHR(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceSurfaceCapabilitiesKHR(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceSurfaceFormatsKHR(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceSurfacePresentModesKHR(void) { return; }
          __declspec(dllexport) void vkCreateDisplayModeKHR(void) { return; }
          __declspec(dllexport) void vkGetDisplayPlaneSupportedDisplaysKHR(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceDisplayPropertiesKHR(void) { return; }
          __declspec(dllexport) void vkGetPhysicalDeviceDisplayPlanePropertiesKHR(void) { return; }
          __declspec(dllexport) void vkGetDisplayModePropertiesKHR(void) { return; }
          __declspec(dllexport) void vkEnumerateInstanceExtensionProperties(void) { return; }
          __declspec(dllexport) void vkEnumerateDeviceExtensionProperties(void) { return; }
          EOF
          gcc -shared -o release/vulkan-1.dll vulkan_stub.c
          echo "Stub vulkan-1.dll created"

      - name: Bundle all dependencies
        shell: msys2 {0}
        run: |
          set +e
          MINGW_PREFIX="/ucrt64"
          EXE="release/orion.exe"
          DEST="release"

          echo "Copying direct dependencies..."
          for dll in $(ldd "$EXE" | grep "$MINGW_PREFIX" | awk '{print $3}' | sort -u); do
            if echo "$dll" | grep -qi "vulkan"; then
              echo "Skipping: $(basename $dll)"
            else
              cp "$dll" "$DEST/"
            fi
          done

          echo "Copying runtime DLLs..."
          cp "$MINGW_PREFIX/bin/libwinpthread-1.dll" "$DEST/"
          cp "$MINGW_PREFIX/bin/libgcc_s_seh-1.dll" "$DEST/"
          cp "$MINGW_PREFIX/bin/libstdc++-6.dll" "$DEST/"
          cp "$MINGW_PREFIX/bin/libmpv-2.dll" "$DEST/"

          echo "Resolving second-level dependencies..."
          for pass in 1 2 3; do
            for existing_dll in "$DEST"/*.dll; do
              [ -f "$existing_dll" ] || continue
              for needed in $(ldd "$existing_dll" 2>/dev/null | grep "$MINGW_PREFIX" | awk '{print $3}' | sort -u); do
                if [ ! -f "$DEST/$(basename $needed)" ]; then
                  cp "$needed" "$DEST/"
                fi
              done
            done
          done

          echo "Bundling missing common DLLs..."
          for missing in libicudt78.dll libicuin78.dll libicuuc78.dll libbrotlidec.dll libbrotlicommon.dll libintl-8.dll libiconv-2.dll libzstd.dll libpcre2-8-0.dll libharfbuzz-0.dll libgraphite2.dll libfreetype-6.dll libbz2-1.dll libpng16-16.dll libEGL.dll libGLESv2.dll libssl-3-x64.dll libcrypto-3-x64.dll; do
            if [ -f "$MINGW_PREFIX/bin/$missing" ]; then
              cp "$MINGW_PREFIX/bin/$missing" "$DEST/"
            fi
          done

          echo "Bundling display/runtime DLLs that qwindows needs..."
          for display_dll in libEGL.dll libGLESv2.dll d3dcompiler_47.dll libdxcompiler.dll dxil.dll; do
            if [ -f "$MINGW_PREFIX/bin/$display_dll" ]; then
              cp "$MINGW_PREFIX/bin/$display_dll" "$DEST/"
              echo "  Bundled $display_dll"
            fi
          done

          echo "Bundling ANGLE/DirectX DLLs from MSYS2..."
          for angle_dll in libEGL.dll libGLESv2.dll d3dcompiler_47.dll dxgi.dll d3d12.dll; do
            if [ -f "$MINGW_PREFIX/bin/$angle_dll" ]; then
              cp "$MINGW_PREFIX/bin/$angle_dll" "$DEST/"
              echo "  Bundled $angle_dll from MSYS2"
            fi
          done          

          echo "Bundling Qt plugins..."
          mkdir -p "$DEST/platforms" "$DEST/styles" "$DEST/imageformats"
          cp "$MINGW_PREFIX/share/qt5/plugins/platforms/qwindows.dll" "$DEST/platforms/" 2>/dev/null || true
          cp "$MINGW_PREFIX/share/qt5/plugins/styles/qwindowsvistastyle.dll" "$DEST/styles/" 2>/dev/null || true
          cp "$MINGW_PREFIX/share/qt5/plugins/imageformats/qsvg.dll" "$DEST/imageformats/" 2>/dev/null || true
          cp "$MINGW_PREFIX/share/qt5/plugins/imageformats/qjpeg.dll" "$DEST/imageformats/" 2>/dev/null || true

          echo "Nuclear QML fix - copy EVERYTHING Qt5 QML related..."
          mkdir -p "$DEST/qml"
          cp -r "$MINGW_PREFIX/share/qt5/qml/"* "$DEST/qml/" 2>/dev/null || true

          echo "=== Fixing plugin dependencies ==="
          echo "Checking what qtquick2plugin.dll needs..."
          ldd "$DEST/qml/QtQuick.2/qtquick2plugin.dll" 2>/dev/null | grep "not found" && echo "  MISSING DEPENDENCIES FOUND" || echo "  All dependencies satisfied"
          
          echo "Checking what qsvg.dll needs..."
          ldd "$DEST/imageformats/qsvg.dll" 2>/dev/null | grep "not found" && echo "  MISSING DEPENDENCIES FOUND" || echo "  All dependencies satisfied"
          
          echo "Recursively resolving ALL plugin dependencies..."
          for pass in 1 2 3; do
            echo "Pass $pass..."
            find "$DEST" -name "*.dll" | while read dll; do
              for needed in $(ldd "$dll" 2>/dev/null | grep "$MINGW_PREFIX" | awk '{print $3}' | sort -u); do
                if [ ! -f "$DEST/$(basename $needed)" ]; then
                  echo "  Copying $(basename $needed) for $(basename $dll)"
                  cp "$needed" "$DEST/"
                fi
              done
            done
          done
          
          echo "Checking for any remaining missing DLLs..."
          find "$DEST" -name "*.dll" | while read dll; do
            ldd "$dll" 2>/dev/null | grep "not found" && echo "  $(basename $dll) STILL HAS MISSING DEPS"
          done

          echo "Also install any missing QML packages..."
          pacman -S --noconfirm mingw-w64-ucrt-x86_64-qt5-quickcontrols mingw-w64-ucrt-x86_64-qt5-quickcontrols2 2>/dev/null || true


          echo "Installing ANGLE and EGL packages..."
          pacman -S --noconfirm mingw-w64-ucrt-x86_64-angleproject mingw-w64-ucrt-x86_64-qt5-angle 2>/dev/null || true

          echo "Copying ANGLE DLLs from repo..."
          cp windows-deps/libEGL.dll "$DEST/" 2>/dev/null || echo "  WARNING: libEGL.dll not found in windows-deps/"
          cp windows-deps/libGLESv2.dll "$DEST/" 2>/dev/null || echo "  WARNING: libGLESv2.dll not found in windows-deps/"
                  
          echo "Copy any newly installed QML files..."
          cp -r "$MINGW_PREFIX/share/qt5/qml/"* "$DEST/qml/" 2>/dev/null || true

          echo "Create proper qt.conf..."
          cat > "$DEST/qt.conf" << 'EOF'
          [Paths]
          Prefix = .
          Qml2Imports = qml
          EOF

          echo "Creating launcher with error logging..."
          cat > "$DEST/orion-revived.bat" << 'EOF'
          @echo off
          echo === Orion Debug Log === > debug.log
          echo Date: %date% %time% >> debug.log
          echo Computer: %COMPUTERNAME% >> debug.log
          echo. >> debug.log
          
          set PATH=%~dp0;%PATH%
          
          echo Setting environment variables... >> debug.log
          set QT_QPA_PLATFORM=windows
          set QT_QUICK_BACKEND=software
          set QSG_RHI_BACKEND=opengl
          set QT_OPENGL=software
          set QT_ANGLE_PLATFORM=warp
          set MPV_VO=gpu
          set MPV_GPU_API=opengl
          set QT_LOGGING_RULES=qt.qpa.*=true
          set QT_DEBUG_PLUGINS=1
          
          echo Environment set. Launching orion.exe... >> debug.log
          echo. >> debug.log
          echo === Orion Output === >> debug.log
          orion.exe >> debug.log 2>&1
          
          echo. >> debug.log
          echo === Exit Code: %ERRORLEVEL% === >> debug.log
          
          type debug.log
          pause
          EOF

          echo "Creating minimal debug launcher..."
          cat > "$DEST/orion-debug.bat" << 'EOF'
          @echo off
          set PATH=%~dp0;%PATH%
          set QT_DEBUG_PLUGINS=1
          set QT_LOGGING_RULES=qt.qpa.*=true
          orion.exe 2> stderr.log
          type stderr.log
          pause
          EOF

          echo "=== Bundle complete ==="
          find "$DEST" -name "*.dll" | wc -l
          echo "DLLs bundled"

      - name: Clean artifact
        shell: msys2 {0}
        run: |
          find release/ -name "*.o" -delete
          find release/ -name "*.cpp" -delete
          find release/ -name "*.c" -delete
          find release/ -name "*.h" -delete
          find release/ -name "Makefile*" -delete
          echo "Artifact cleaned"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: orion-revived-windows
          path: |
            release/**/*.dll
            release/**/*.exe
            release/**/*.bat
            release/**/*.conf
            release/**/*.log
            release/**/qml/**
            release/**/platforms/**
            release/**/styles/**
            release/**/imageformats/**
