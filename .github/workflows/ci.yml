name: CI

on:
  push:
    branches:
      - master
      - main
      - modernize-maintenance
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux Qt5/${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: mpv
            config: CONFIG+=mpv
            packages: libmpv-dev
          - backend: multimedia
            config: CONFIG+=multimedia
            packages: qtmultimedia5-dev qml-module-qtmultimedia
          - backend: mpv-multimedia
            config: CONFIG+=mpv CONFIG+=multimedia
            packages: libmpv-dev qtmultimedia5-dev qml-module-qtmultimedia

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: ci/install_ubuntu_ci_deps.sh ${{ matrix.packages }}

      - name: Validate packaging metadata
        run: |
          appstreamcli validate --pedantic --no-net distfiles/Orion.appdata.xml
          desktop-file-validate distfiles/Orion.desktop

      - name: Validate legacy CI guard
        run: ci/check_legacy_ci_guard.sh

      - name: Validate build documentation
        run: ci/check_build_docs.sh

      - name: Validate workflow hygiene
        run: ci/check_workflow_hygiene.sh

      - name: Validate version checker
        run: ci/check_version_checker.sh

      - name: Validate patch whitespace
        run: ci/check_patch_whitespace.sh

      - name: Validate upstream issue triage
        run: ci/check_upstream_issue_triage.sh

      - name: Validate Twitch API usage
        run: ci/check_twitch_api_guard.sh

      - name: Validate OAuth callback parser
        run: ci/check_oauth_callback_parser.sh

      - name: Validate OAuth token validation
        run: ci/check_oauth_token_validation.sh

      - name: Validate Twitch emote ID handling
        run: ci/check_twitch_emote_ids.sh

      - name: Validate IRC tag parsing
        run: ci/check_irc_tag_parsing.sh

      - name: Validate Android metadata
        run: ci/check_android_metadata.sh

      - name: Validate Apple metadata
        run: ci/check_apple_metadata.sh

      - name: Validate QML resources
        run: ci/check_qml_resources.sh

      - name: Validate QML runtime dependencies
        run: ci/check_qml_runtime_deps.sh

      - name: Validate QML fonts
        run: ci/check_qml_fonts.sh

      - name: Validate QML image fallbacks
        run: ci/check_qml_image_fallbacks.sh

      - name: Validate notification fallbacks
        run: ci/check_notification_fallbacks.sh

      - name: Validate modern Qt helper code
        run: ci/check_modern_qt_helpers.sh

      - name: Validate QML window contracts
        run: ci/check_qml_window_contracts.sh

      - name: Validate QML emote picker contracts
        run: ci/check_qml_emote_picker_contracts.sh

      - name: Validate QML VOD view contracts
        run: ci/check_qml_vod_view_contracts.sh

      - name: Validate QML HTML utilities
        run: ci/check_qml_util_html.sh

      - name: Validate playback recovery
        run: ci/check_playback_recovery.sh

      - name: Validate M3U8 parser
        run: ci/check_m3u8_parser.sh

      - name: Configure
        run: ci/run_qmake.sh orion.pro ${{ matrix.config }}

      - name: Build
        run: make -j"$(nproc)"

      - name: Validate install target
        run: |
          install_root="$PWD/install-root"
          make INSTALL_ROOT="$install_root" install
          test -x "$install_root/usr/bin/orion"
          test -f "$install_root/usr/share/metainfo/Orion.appdata.xml"
          test -f "$install_root/usr/share/applications/Orion.desktop"
          test -f "$install_root/usr/share/icons/hicolor/scalable/apps/orion.svg"
