name: CI

on:
  push:
    branches:
      - master
      - main
      - modernize-maintenance
  pull_request:

jobs:
  linux-mpv:
    name: Linux Qt5/mpv
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream \
            build-essential \
            desktop-file-utils \
            libsystemd-dev \
            libmpv-dev \
            pkg-config \
            ripgrep \
            qt5-qmake \
            qtbase5-dev \
            qtdeclarative5-dev \
            qml-module-qtgraphicaleffects \
            qml-module-qtquick-controls \
            qml-module-qtquick-controls2 \
            qml-module-qtquick-layouts \
            qml-module-qtquick-window2 \
            qml-module-qtquick2 \
            qtquickcontrols2-5-dev

      - name: Validate packaging metadata
        run: |
          appstreamcli validate --pedantic distfiles/Orion.appdata.xml
          desktop-file-validate distfiles/Orion.desktop

      - name: Validate Twitch API usage
        run: ci/check_twitch_api_guard.sh

      - name: Validate M3U8 parser
        run: ci/check_m3u8_parser.sh

      - name: Configure
        run: qmake orion.pro CONFIG+=mpv

      - name: Build
        run: make -j"$(nproc)"

      - name: Validate install target
        run: |
          install_root="$PWD/install-root"
          make INSTALL_ROOT="$install_root" install
          test -x "$install_root/usr/bin/orion"
          test -f "$install_root/usr/share/metainfo/Orion.appdata.xml"
          test -f "$install_root/usr/share/applications/Orion.desktop"
          test -f "$install_root/usr/share/icons/hicolor/scalable/apps/orion.svg"
