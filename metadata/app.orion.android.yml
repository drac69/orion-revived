Name: Orion
Summary: Twitch client maintained from the archived Orion source
Description: |-
  Orion is a Qt/QML Twitch client maintained from the archived upstream Orion
  project. This fork keeps the desktop source build usable and preserves the
  legacy Qt 5 Android package sources for future validation.

  Android release publishing is disabled until the fork has a maintained,
  reproducible Qt Android build recipe and target-device validation.
