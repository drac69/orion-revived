Name: Orion
Summary: Twitch client maintained from the archived Orion source
Description: |-
  Orion is a Qt/QML Twitch client maintained from the archived upstream Orion
  project. This fork keeps the desktop source build usable and preserves the
  legacy Qt 5 Android package sources for source-level reference only.

  Android/F-Droid release publishing is retired for this fork. The metadata
  remains disabled because no maintained, reproducible Qt Android build recipe or
  target-device validation is available.
